function shuffleAnswers(arr){
  const items=arr.map((answer,originalIndex)=>({answer,originalIndex}));
  for(let k=items.length-1;k>0;k--){
    const j=Math.floor(Math.random()*(k+1));
    [items[k],items[j]]=[items[j],items[k]];
  }
  return items;
}
